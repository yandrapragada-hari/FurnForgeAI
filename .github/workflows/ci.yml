name: FurnForge AI CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov fastapi httpx opencv-python-headless numpy pillow requests python-dotenv pydantic

      - name: Lint Python with Ruff
        run: |
          ruff check backend/tests

      - name: Run Backend Pytest Suite with Coverage
        run: |
          pytest --cov=app.pipeline.cv_preprocessor --cov=app.pipeline.prompt_builder --cov=app.pipeline.cnn_extractor --cov-report=term-missing backend/tests

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Frontend Lint
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build
