server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|glb|gltf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:8005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50M;
    }

    # Reverse proxy static backend media folders
    location /outputs/ {
        proxy_pass http://backend:8005/outputs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:8005/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /sample_sketches/ {
        proxy_pass http://backend:8005/sample_sketches/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
